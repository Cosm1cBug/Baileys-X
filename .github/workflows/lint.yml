name: Linting Check

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node and Corepack
        uses: actions/setup-node@v3.6.0
        with:
          node-version: 20.x

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Restore Yarn Cache
        uses: actions/cache@v3
        id: yarn-cache
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install packages
        run: yarn install --immutable

      - name: Check linting
        run: yarn lint

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node and Corepack
        uses: actions/setup-node@v3.6.0
        with:
          node-version: 20.x

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Install packages
        run: yarn install --immutable

      # Informational for now: this library necessarily tracks upstream
      # advisories in transitive deps. Review the output on every PR;
      # flip continue-on-error off once the baseline is clean.
      - name: Audit dependencies (moderate and above)
        continue-on-error: true
        run: yarn npm audit --recursive --severity moderate
